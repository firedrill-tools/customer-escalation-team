[project]
name = "customer-escalation-team"
version = "0.2.0"
readme = "README.md"
description = "OpenAI Agents SDK triage, billing and account specialist handoffs"
requires-python = ">=3.12"
dependencies = ["openai-agents==0.23.1", "openai==3.31.0", "httpx2==2.13.1", "pydantic==2.14.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
escalation-team = "escalation_team.cli:main"
escalation-team-state = "escalation_team.managed_cli:main"
escalation-team-cases = "escalation_team.cases:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escalation_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["firedrill", "src", "fixtures", "scenarios", "tests", "scripts", ".github", "README.md", "AGENTS.md", "PLAN.md", "COMPATIBILITY.md", "pyproject.toml", "uv.lock", ".gitignore"]
